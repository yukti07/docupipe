[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zamp-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

