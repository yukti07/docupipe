app:
  environment: development
  log_level: INFO
database:
  url: postgresql+psycopg://zamp:change-me@localhost:5432/zamp
  pool_size: 2
  max_overflow: 2
gcp:
  project_id: ""
  storage_bucket: ""
processing:
  csv_chunk_size: 1000
  max_file_size_mb: 100
  max_records: 100000
schema:
  sample_rows: 20
  max_sample_bytes: 1048576
  max_image_bytes: 14000000
  max_pdf_bytes: 14000000
  prompts_dir: prompts
llm:
  enabled: false
  provider: "gemini"
  model: "gemini-3.5-flash"
  # Secret. Set ZAMP_LLM_API_KEY in .env or Secret Manager; never here.
  api_key: ""
  temperature: 0
  max_output_tokens: 8192
  max_retries: 3
  timeout_seconds: 60

