services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zamp
      POSTGRES_USER: zamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
  schema-detector:
    build:
      context: ./python
      dockerfile: schema-detector/Dockerfile
    env_file: .env
    environment:
      ZAMP_CONFIG_PATH: /app/config/config.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
    ports: ["8080:8080"]
    depends_on: [postgres]
    volumes:
      - ./config:/app/config:ro
      - ${APPDATA}/gcloud:/gcp:ro
  data-processor:
    build:
      context: ./python
      dockerfile: data-processor/Dockerfile
    env_file: .env
    environment:
      ZAMP_CONFIG_PATH: /app/config/config.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
    ports: ["8081:8080"]
    depends_on: [postgres]
    volumes:
      - ./config:/app/config:ro
      - ${APPDATA}/gcloud:/gcp:ro
